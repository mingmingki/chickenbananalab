name: Autotrader CI and read-only server check
on:
  push:
    branches: [main, infra/autotrader-cicd]
    paths: ['autotrader/**', 'infra/autotrader/**', '.github/workflows/autotrader-ci.yml', '.gitignore']
  pull_request:
    paths: ['autotrader/**', 'infra/autotrader/**', '.github/workflows/autotrader-ci.yml', '.gitignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autotrader-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s infra/autotrader/tests -v
      - run: python infra/autotrader/check_sources.py
      - run: bash -n infra/autotrader/verify.sh infra/autotrader/probe.sh infra/autotrader/forced-probe.sh
  regression:
    needs: source-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [tests, gemini_checks, negative_guard_checks, rollback_checks, rollback_full_checks]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: autotrader/requirements-ci.txt
      - run: python -m pip install -r autotrader/requirements-ci.txt
      - name: Run isolated offline suite
        working-directory: autotrader
        env:
          PYTHONPATH: ${{ github.workspace }}/infra/autotrader:${{ github.workspace }}/autotrader
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          SUITE: ${{ matrix.suite }}
        run: python -m pytest -p offline "$SUITE" -q
  package:
    needs: [source-safety, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: |
          mkdir dist-autotrader
          python infra/autotrader/release.py --output "dist-autotrader/autotrader-${GITHUB_SHA}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autotrader-source-${{ github.sha }}
          path: dist-autotrader/*
          if-no-files-found: error
          retention-days: 7
  server-connection:
    # Independent of app regressions: this checks transport, never deploys code.
    needs: source-safety
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/infra/autotrader-cicd'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.AUTOTRADER_GCP_PROJECT }}
          workload_identity_provider: ${{ vars.AUTOTRADER_WIF_PROVIDER }}
          service_account: ${{ vars.AUTOTRADER_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify read-only SSH access through GCP IAP
        env:
          AUTOTRADER_GCP_PROJECT: ${{ vars.AUTOTRADER_GCP_PROJECT }}
          AUTOTRADER_GCP_ZONE: ${{ vars.AUTOTRADER_GCP_ZONE }}
          AUTOTRADER_GCP_INSTANCE: ${{ vars.AUTOTRADER_GCP_INSTANCE }}
          AUTOTRADER_SSH_HOST: ${{ vars.AUTOTRADER_SSH_HOST }}
          AUTOTRADER_SSH_USER: ${{ vars.AUTOTRADER_SSH_USER }}
          AUTOTRADER_SSH_KEY: ${{ secrets.AUTOTRADER_SSH_KEY }}
          AUTOTRADER_SSH_KNOWN_HOSTS: ${{ secrets.AUTOTRADER_SSH_KNOWN_HOSTS }}
        run: bash infra/autotrader/probe.sh
