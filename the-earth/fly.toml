# Fly.io 배포 설정. 처음 한 번: fly launch --no-deploy --copy-config → fly volumes create earth_data --size 1 --region nrt → fly deploy
app = "the-earth"            # 원하는 앱 이름으로 바꾸세요 (전 세계에서 하나뿐이어야 함)
primary_region = "nrt"       # 도쿄 (한국에서 가장 가까운 지역)

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

# 게임 세계·계정이 저장되는 영구 디스크
[[mounts]]
  source = "earth_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # 시뮬레이션은 접속자가 없어도 계속 흘러야 하므로 절대 끄지 않는다
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
