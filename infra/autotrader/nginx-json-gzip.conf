# AutoTrader dashboard bandwidth guard.
# Production /etc/nginx/nginx.conf already has `gzip on;` in the http context.
# This supplemental file only extends compression policy; it must not duplicate gzip on.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/plain text/css;
