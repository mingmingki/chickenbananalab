{% extends "core/base.html" %}
{% block title %}관리자 로그인 | ChickenBanana Lab{% endblock %}

{% block content %}

<style>
    .login-page {
        min-height: calc(100vh - 160px);
        padding: 80px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 20% 10%, rgba(34, 197, 94, 0.14), transparent 30%),
            radial-gradient(circle at 80% 0%, rgba(250, 204, 21, 0.18), transparent 32%),
            linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .login-card {
        width: 100%;
        max-width: 440px;
        padding: 42px 38px;
        border-radius: 32px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        box-shadow: 0 30px 90px rgba(15, 23, 42, 0.14);
    }

    .login-logo {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-logo-circle {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 24px;
        background: #111827;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 18px;
    }

    .login-logo h1 {
        font-size: 32px;
        line-height: 1.2;
        letter-spacing: -0.06em;
        color: #0f172a;
    }

    .login-logo p {
        margin-top: 10px;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
    }

    .login-error {
        margin-bottom: 18px;
        padding: 14px 16px;
        border-radius: 16px;
        background: #fef2f2;
        color: #dc2626;
        font-size: 14px;
        font-weight: 800;
    }

    .login-form {
        display: grid;
        gap: 18px;
    }

    .login-field label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 900;
        color: #111827;
    }

    .login-field input {
        width: 100%;
        height: 54px;
        padding: 0 16px;
        border: 1px solid #d1d5db;
        border-radius: 16px;
        background: #fff;
        font-size: 16px;
        outline: none;
        box-sizing: border-box;
    }

    .login-field input:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
    }

    .login-submit {
        width: 100%;
        height: 56px;
        margin-top: 8px;
        border: none;
        border-radius: 999px;
        background: #111827;
        color: #fff;
        font-size: 16px;
        font-weight: 900;
        cursor: pointer;
    }

    .login-submit:hover {
        background: #000;
    }

    .login-bottom {
        margin-top: 24px;
        text-align: center;
    }

    .login-bottom a {
        color: #64748b;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
    }
</style>

<section class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <div class="login-logo-circle">CB</div>
            <h1>관리자 로그인</h1>
            <p>ChickenBanana Lab 콘텐츠 관리를 위해 로그인하세요.</p>
        </div>

        {% if form.errors %}
        <div class="login-error">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}

            <div class="login-field">
                <label for="{{ form.username.id_for_label }}">아이디</label>
                {{ form.username }}
            </div>

            <div class="login-field">
                <label for="{{ form.password.id_for_label }}">비밀번호</label>
                {{ form.password }}
            </div>

            <button type="submit" class="login-submit">로그인</button>
        </form>

        <div class="login-bottom">
            <a href="{% url 'home' %}">홈으로 돌아가기</a>
        </div>
    </div>
</section>

{% endblock %}
