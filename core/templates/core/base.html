<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}ChickenBanana Lab{% endblock %}</title>
  <style>
    body{font-family:system-ui,Segoe UI,Apple SD Gothic Neo,맑은 고딕,sans-serif;margin:0;color:#111827}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1000px;margin:0 auto;padding:22px 18px}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:800;letter-spacing:.4px}
    .menu{display:flex;gap:14px;font-size:14px}
    .pill{display:inline-block;padding:6px 10px;border:1px solid #e5e7eb;border-radius:999px;font-size:12px}
    .hero{padding:46px 0}
    h1{font-size:42px;line-height:1.15;margin:12px 0}
    p{color:#374151;line-height:1.65}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
    .card{border:1px solid #e5e7eb;border-radius:16px;padding:16px}
    .btn{display:inline-block;margin-top:16px;padding:10px 14px;border-radius:12px;border:1px solid #111827}
    footer{border-top:1px solid #e5e7eb;margin-top:40px}
    .muted{color:#6b7280;font-size:12px}
    @media (max-width:860px){.grid{grid-template-columns:1fr}.menu{gap:10px}}
  </style>
</head>
<body>
  <header class="wrap">
    <div class="nav">
      <div class="brand"><a href="/">CHICKENBANANA LAB</a></div>
      <nav class="menu">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap">
      <div class="muted">© {% now "Y" %} ChickenBanana Lab. All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
