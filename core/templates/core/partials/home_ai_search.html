{# Chicken Banana unified search entry: actual site search, AI chat remains admin research only until model is connected. #}
<style>
  main.cblx-home > .cbl-home-assistant-search {
    width: 100% !important;
    margin: 0 0 24px !important;
    padding: 22px 26px !important;
    box-sizing: border-box !important;
    display: flex;
    align-items: center;
    gap: 25px;
    border: 1px solid #dce9eb;
    border-radius: 18px;
    background: linear-gradient(120deg, #f1faf8 0%, #f9fcfd 47%, #f3f7fd 100%);
    box-shadow: 0 5px 22px rgba(14, 57, 78, .045);
  }
  .cbl-home-assistant-search .cbl-has-intro { flex: 0 0 250px; min-width: 0; }
  .cbl-home-assistant-search .cbl-has-eyebrow {
    color: #16847e; font-size: 11px; font-weight: 750; letter-spacing: .08em; margin-bottom: 5px;
  }
  .cbl-home-assistant-search .cbl-has-heading {
    margin: 0 !important; color: #183b49; font-size: 19px !important; font-weight: 800;
    letter-spacing: -.04em; line-height: 1.25;
  }
  .cbl-home-assistant-search .cbl-has-desc {
    margin: 7px 0 0 !important; color: #687f89; font-size: 12px; line-height: 1.5;
  }
  .cbl-home-assistant-search .cbl-has-main { flex: 1 1 0; min-width: 0; }
  .cbl-home-assistant-search .cbl-has-form {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid #cbdfe1; border-radius: 15px; background: #fff;
    padding: 6px 7px 6px 15px; box-sizing: border-box;
    box-shadow: 0 2px 6px rgba(26, 77, 95, .035);
  }
  .cbl-home-assistant-search .cbl-has-search-icon {
    width: 20px; height: 20px; flex-shrink: 0; stroke: #73939e;
    stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .cbl-home-assistant-search input[name="q"] {
    flex: 1 1 0; min-width: 0; width: 100%; background: transparent;
    border: 0 !important; outline: none !important; box-shadow: none !important;
    border-radius: 0; font: inherit; font-size: 14px;
    color: #183b49; padding: 9px 3px !important; height: auto !important;
  }
  .cbl-home-assistant-search input[name="q"]::placeholder { color: #94a6af; opacity: 1; }
  .cbl-home-assistant-search .cbl-has-form:focus-within {
    border-color: #369c9a; box-shadow: 0 0 0 3px rgba(49, 157, 151, .12);
  }
  .cbl-home-assistant-search .cbl-has-submit {
    flex-shrink: 0; padding: 11px 19px !important; border: 0 !important;
    background: #118e88 !important; color: #fff !important; border-radius: 11px !important;
    cursor: pointer; font-size: 13px !important; font-weight: 750;
    height: auto !important; min-height: 39px;
  }
  .cbl-home-assistant-search .cbl-has-submit:hover { background: #0d736e !important; }
  .cbl-home-assistant-search .cbl-has-meta {
    display: flex; gap: 10px; justify-content: space-between; align-items: center;
    margin-top: 7px; flex-wrap: wrap;
    color: #7a9099; font-size: 11px; line-height: 1.5;
  }
  .cbl-home-assistant-search .cbl-has-ai-link {
    color: #5376aa; text-decoration: none; border-bottom: 1px solid #c1d4e9;
    font-weight: 650; white-space: nowrap;
  }
  .cbl-home-assistant-search .cbl-has-ai-link:hover { color: #27578e; }
  @media (max-width: 960px) {
    main.cblx-home > .cbl-home-assistant-search {
      padding: 18px !important; gap: 12px; flex-direction: column; align-items: stretch;
    }
    .cbl-home-assistant-search .cbl-has-intro { flex-basis: auto; }
    .cbl-home-assistant-search .cbl-has-heading { font-size: 17px !important; }
    .cbl-home-assistant-search .cbl-has-desc { margin-top: 3px !important; }
  }
  @media (max-width: 480px) {
    main.cblx-home > .cbl-home-assistant-search { padding: 14px !important; margin-bottom: 16px !important; }
    .cbl-home-assistant-search .cbl-has-form { padding-left: 10px; gap: 5px; }
    .cbl-home-assistant-search .cbl-has-submit { padding: 10px 13px !important; }
    .cbl-home-assistant-search input[name="q"] { font-size: 13px; }
  }
</style>
<section class="cbl-home-assistant-search" aria-label="사이트 통합 검색">
  <div class="cbl-has-intro">
    <div class="cbl-has-eyebrow">CHICKEN BANANA SEARCH</div>
    <h2 class="cbl-has-heading">무엇을 찾고 계신가요?</h2>
    <p class="cbl-has-desc">건설·BIM·테크 정보와 프로그램을 한곳에서 검색하세요.</p>
  </div>
  <div class="cbl-has-main">
    <form class="cbl-has-form" action="{% url 'search' %}" method="get" role="search">
      <svg class="cbl-has-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.7" cy="10.7" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
      <input type="search" name="q" maxlength="120" required aria-label="사이트 콘텐츠 검색어" placeholder="예: Revit 수량산출, Dynamo 자동화, 건설 실무">
      <button class="cbl-has-submit" type="submit">검색</button>
    </form>
    <div class="cbl-has-meta">
      <span>사이트 콘텐츠 검색 제공 · AI 대화 기능은 개발 중</span>
      {% if user.is_staff %}<a class="cbl-has-ai-link" href="{% url 'ai_lab' %}" title="독립 AI 모델 연결 전 관리자 테스트 페이지">AI 대화 베타 ↗</a>{% endif %}
    </div>
  </div>
</section>
